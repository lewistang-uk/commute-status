name: Collect TfL Data
run-name: Data Collection
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # only needs requests, not entire requirements.txt
          pip install requests 
          
      - name: Run data collection
        run: |
          python scripts/collect.py
          python scripts/collect_train_numbers.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/tfl_train_data.db

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update TfL arrivals database"
            git push
          fi
