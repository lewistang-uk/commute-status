name: Collect TfL Data
run-name: Data Collection
on:
  schedule:
    # 07:00–09:55 BST (06:00–08:55 UTC)
    - cron: "*/5 6-8 * * *"

    # 10:00–10:30 BST (09:00–09:30 UTC)
    - cron: "0-30/5 9 * * *"

    # 15:30–15:55 BST (14:30–14:55 UTC)
    - cron: "30-59/5 14 * * *"

    # 16:00–17:55 BST (15:00–16:55 UTC)
    - cron: "*/5 15-17 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data collection
        run: |
          python scripts/collect.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tfl_train_data.db

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update TfL arrivals database"
            git push
          fi
